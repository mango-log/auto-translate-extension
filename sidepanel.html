<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Auto Translate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #15151e;
      color: #e8e8f0;
      font-size: 13px;
      min-height: 100vh;
    }

    .header {
      padding: 14px 16px;
      background: #1c1c2a;
      border-bottom: 1px solid #2a2a3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 { font-size: 15px; font-weight: 600; color: #7c8cff; }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #22222f;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8a8a9e;
      margin-bottom: 10px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-label { font-size: 14px; font-weight: 500; }

    .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #33334a; border-radius: 24px; transition: 0.25s;
    }
    .slider:before {
      content: ''; position: absolute; width: 18px; height: 18px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.25s;
    }
    input:checked + .slider { background: #7c8cff; }
    input:checked + .slider:before { transform: translateX(20px); }

    .lang-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .lang-row select { flex: 1; }
    .arrow { color: #8a8a9e; flex-shrink: 0; }

    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: #1c1c2a;
      border: 1px solid #2f2f45;
      border-radius: 6px;
      color: #e8e8f0;
      font-size: 13px;
    }

    select:focus, input:focus { outline: none; border-color: #7c8cff; }

    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 11px;
      color: #8a8a9e;
      margin-bottom: 4px;
    }

    .hint { font-size: 11px; color: #66667a; margin-top: 4px; }

    .status {
      font-size: 12px;
      color: #8a8a9e;
      min-height: 16px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
    .status.active { color: #5dd39e; }
    .status.error { color: #ff6b81; }
    .status.loading { color: #ffb86b; }

    .progress-bar {
      height: 4px;
      background: #22222f;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }
    .progress-bar.visible { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #7c8cff;
      transition: width 0.3s;
    }

    .selection-box {
      background: #1c1c2a;
      border: 1px solid #2f2f45;
      border-radius: 8px;
      padding: 10px;
      margin-top: 4px;
    }

    .selection-original {
      font-size: 12px;
      color: #9a9ab0;
      max-height: 80px;
      overflow-y: auto;
      padding-bottom: 8px;
      border-bottom: 1px dashed #33334a;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .selection-translated {
      font-size: 13px;
      color: #e8e8f0;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .empty { color: #55556a; font-size: 12px; font-style: italic; }

    .btn-save {
      width: 100%;
      padding: 9px;
      background: #7c8cff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-save:hover { opacity: 0.88; }

    details summary {
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8a8a9e;
      margin-bottom: 10px;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    details summary::before { content: '▸'; transition: transform 0.15s; }
    details[open] summary::before { transform: rotate(90deg); }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI Auto Translate</h1>
  </div>

  <div class="section">
    <div class="toggle-row">
      <span class="toggle-label">페이지 번역</span>
      <label class="toggle">
        <input type="checkbox" id="translateToggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="status"></div>
  </div>

  <div class="section">
    <div class="section-title">번역 엔진</div>
    <select id="engine">
      <option value="google">Google 번역 (무료)</option>
      <option value="ai">AI 번역 (API 키 필요)</option>
    </select>
    <div class="hint" id="engineHint"></div>
  </div>

  <div class="section">
    <div class="section-title">언어 설정</div>
    <div class="lang-row">
      <select id="sourceLang">
        <option value="auto">자동 감지</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ไทย</option>
      </select>
      <span class="arrow">→</span>
      <select id="targetLang">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ไทย</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">선택 텍스트 번역</div>
    <div class="selection-box">
      <div class="selection-original" id="selOriginal"><span class="empty">페이지에서 텍스트를 드래그하면 여기에 번역이 표시됩니다</span></div>
      <div class="selection-translated" id="selTranslated"></div>
    </div>
  </div>

  <div class="section">
    <details id="settingsDetails">
      <summary>AI 설정</summary>
      <div class="field">
        <label>AI 제공자</label>
        <select id="provider">
          <option value="anthropic">Claude (Anthropic)</option>
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini (Google)</option>
        </select>
      </div>
      <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
        <div class="hint">키는 이 브라우저의 로컬 저장소에만 저장됩니다</div>
      </div>
      <div class="field">
        <label>모델 (비워두면 기본값)</label>
        <input type="text" id="model" placeholder="claude-opus-5">
      </div>
      <button class="btn-save" id="saveBtn">저장</button>
      <div class="status" id="settingsStatus"></div>
    </details>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
